# Modelo de release para o fluxo com promoção: staging -> main -> produção.
#
# A TRAVA É A ESTEIRA. Proteção de branch pode não existir no plano contratado (ex.: GitHub
# Free em repositório privado), e um environment sem regra de proteção não bloqueia nada.
# Então, antes de calcular versão, migrar banco ou publicar, o job "homologacao" exige duas
# coisas: que o commit promovido tenha um run do CI concluído com SUCESSO na branch staging,
# e que a árvore publicada (os arquivos que vão para a produção) seja idêntica à dele. Push
# direto em main não passa por staging, não acha run nenhum e é barrado aqui; e o commit
# que ele deixou na main também barra a promoção seguinte, em vez de ir junto de carona.
#
# Requisitos:
#   - PR de staging para main mesclado com MERGE COMMIT (não squash, não rebase): o commit
#     homologado é o segundo pai do merge. Squash cria um commit novo, que nunca rodou na
#     staging, e a trava (corretamente) barra.
#   - Tudo que muda a main chega por merge da staging, inclusive commits de bots: qualquer
#     outra mudança deixa a árvore diferente da homologada, e a trava barra.
#   - .github/scripts/proxima-versao.sh copiado da skill esteira-ci-cd.
#   - Segredos de produção no environment "production".
#
# Substitua cada __MARCADOR__; remova o que não se aplica.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # criar tag e GitHub Release
  actions: read   # a trava consulta os runs do CI; sem isto a API responde 403

# Nunca cancelar uma release em andamento: interromper migração ou deploy pela metade é pior
# do que esperar a próxima.
concurrency:
  group: release-producao
  cancel-in-progress: false

jobs:
  homologacao:
    name: Trava — o commit passou verde na homologação?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # o segundo pai do merge não existe com profundidade 1

      - name: Exigir CI verde na staging e a mesma árvore do commit promovido
        # Valores do GitHub entram pelo env: e são usados entre aspas. Uma expressão escrita
        # dentro do run: é colada no script antes de ele rodar e pode virar código.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Merge de PR traz o topo da staging como segundo pai. Push direto não tem segundo
          # pai: o candidato vira o próprio HEAD, que nunca rodou na staging — e é barrado.
          # Sem --verify, o rev-parse devolveria o texto "HEAD^2" junto com o SHA.
          SHA=$(git rev-parse --verify --quiet 'HEAD^2' || git rev-parse HEAD)
          echo "Commit a promover: $SHA"

          # Falha ao CONSULTAR é diferente de ausência de homologação. Misturar os dois manda
          # quem investiga procurar no lugar errado.
          if ! RESPOSTA=$(gh api \
              "repos/$REPO/actions/workflows/ci.yml/runs?branch=staging&head_sha=$SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.status == "completed") | .conclusion] | join(",")' 2>&1); then
            echo "::error::Não foi possível consultar os runs do CI: $RESPOSTA. Isto NÃO significa que o código não foi homologado — a trava não conseguiu verificar. Confira 'actions: read' em permissions."
            exit 1
          fi

          echo "Conclusões do CI na staging para $SHA: [${RESPOSTA:-nenhuma}]"
          case ",$RESPOSTA," in
            *,success,*) echo "Homologação confirmada." ;;
            ,,) echo "::error::Nenhum run concluído do CI na staging para $SHA. O código não passou pela homologação; release abortada antes de tocar a produção."; exit 1 ;;
            *)  echo "::error::O CI da staging para $SHA terminou como [$RESPOSTA], sem sucesso. Release abortada."; exit 1 ;;
          esac

          # CI verde no segundo pai não basta: o que vai para a produção é a árvore do merge.
          # Um commit que entrou na main sem passar pela staging (push direto cuja release
          # abortou) continua lá e iria junto nesta promoção. No fluxo normal — a main só
          # recebe merges da staging — as duas árvores são idênticas.
          DIFERENCA=0
          git diff --quiet "$SHA" HEAD || DIFERENCA=$?
          case "$DIFERENCA" in
            0) echo "Árvore publicada idêntica à homologada." ;;
            1) echo "::error::A árvore que iria para a produção difere da homologada em $SHA. Causa provável: uma mudança entrou na main sem passar pela staging (ex.: push direto). Traga a main para a staging por PR (o CI roda lá; reverta o que não deve ir ao ar) e promova de novo. Arquivos que diferem:"
               git diff --stat "$SHA" HEAD
               exit 1 ;;
            *) echo "::error::Não foi possível comparar a árvore publicada com $SHA (git saiu com $DIFERENCA). Isto NÃO significa que há diferença — a trava não conseguiu verificar."; exit 1 ;;
          esac

  versao:
    name: Calcular versão
    needs: homologacao
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      proxima: ${{ steps.calculo.outputs.proxima }}
      nivel: ${{ steps.calculo.outputs.nivel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # precisa das tags e do histórico desde a última versão
      - id: calculo
        run: bash .github/scripts/proxima-versao.sh >> "$GITHUB_OUTPUT"
      - name: Resumo
        run: |
          if [ -z "${{ steps.calculo.outputs.proxima }}" ]; then
            echo "Nenhum commit feat/fix/breaking desde a última versão: sem release e sem deploy." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Próxima versão: ${{ steps.calculo.outputs.proxima }} (${{ steps.calculo.outputs.nivel }})" >> "$GITHUB_STEP_SUMMARY"
          fi

  producao:
    name: Migrar e publicar em produção
    needs: versao
    if: needs.versao.outputs.proxima != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: __URL_DE_PRODUCAO__
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # __SETUP_DA_LINGUAGEM__
      - name: Instalar dependências
        run: __COMANDO_INSTALAR__

      - name: Conferir segredos obrigatórios
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          faltando=""
          [ -n "${DATABASE_URL:-}" ] || faltando="$faltando DATABASE_URL"
          [ -n "${DEPLOY_TOKEN:-}" ] || faltando="$faltando DEPLOY_TOKEN"
          if [ -n "$faltando" ]; then
            echo "::error::Segredos ausentes no environment 'production':$faltando. Deploy interrompido para não terminar verde sem ter publicado."
            exit 1
          fi

      - name: Aplicar migrações em produção
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: __COMANDO_MIGRAR__

      - name: Conferir paridade de migrações
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: __COMANDO_PARIDADE_DE_MIGRACOES__

      - name: Deploy em produção
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          VERSAO: ${{ needs.versao.outputs.proxima }}
        run: __COMANDO_DEPLOY_PRODUCAO__

      # Serviço opcional (ex.: envio de source maps ao monitoramento de erros) AVISA, nunca
      # derruba a release: a produção não pode depender de um terceiro opcional.
      # - name: Source maps (aviso, não bloqueia)
      #   continue-on-error: true
      #   run: __COMANDO_OPCIONAL__

      - name: Teste de fumaça em produção
        run: __COMANDO_FUMACA__

  publicar-release:
    name: Tag e GitHub Release
    needs: [versao, producao]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Criar tag e release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ needs.versao.outputs.proxima }}
        run: |
          gh release create "$VERSAO" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$VERSAO" \
            --generate-notes
