# Mantém as actions fixadas por SHA atualizadas. O kit não tem dependências npm.
#
# cooldown: espera 7 dias antes de propor uma versão nova de action. Versões maliciosas
# publicadas em projetos legítimos costumam ser descobertas e retiradas nesse intervalo. Não
# atrasa atualização de segurança. Para actions, só o default-days vale (os prazos por tipo
# de versão, semver-*-days, não se aplicam).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
