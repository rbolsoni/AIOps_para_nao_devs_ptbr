# Release do kit, no fluxo em tronco (modelo release-tronco da skill esteira-ci-cd).
# Só roda quando o CI termina com SUCESSO num push em main; sem feat/fix/breaking desde a
# última tag, não publica nada.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Versão, tag e release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - id: calculo
        run: bash .github/scripts/proxima-versao.sh >> "$GITHUB_OUTPUT"

      - name: Sem versão nova
        if: steps.calculo.outputs.proxima == ''
        run: echo "Nenhum commit feat/fix/breaking desde a última versão; nada a publicar." >> "$GITHUB_STEP_SUMMARY"

      - name: Criar tag e release
        if: steps.calculo.outputs.proxima != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ steps.calculo.outputs.proxima }}
        run: |
          gh release create "$VERSAO" \
            --repo "${{ github.repository }}" \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "$VERSAO" \
            --generate-notes
